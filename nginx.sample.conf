# ------------------------------------------------------------------
# نمونه کانفیگ nginx برای «سامانه اتوماسیون اداری توس‌کابل»
#
# معماری: فرانت‌اند (React) build شده و به‌صورت فایل استاتیک توسطِ خودِ
# سرور Node (Express) روی یک پورت سرو می‌شود. پس nginx فقط یک
# reverse-proxy جلوی همان یک پورت است؛ فرانت و بک‌اند پورت جدا ندارند.
#
# نکتهٔ مهم: تماس صوتی/تصویری (WebRTC) و دسترسی به میکروفون/دوربین فقط
# روی HTTPS کار می‌کند. حتماً بخش SSL را فعال کنید.
#
# پیش‌نیاز: در فایل .env مقدار HOST=127.0.0.1 بگذارید تا Node فقط روی
# لوکال گوش دهد و دسترسی از بیرون فقط از طریق nginx باشد.
# اگر PORT را در .env عوض کردید، در upstream زیر هم همان را بگذارید.
# ------------------------------------------------------------------

upstream tooscable_app {
    server 127.0.0.1:3000;   # همان PORT در فایل .env
    keepalive 32;
}

# --- تغییر مسیر کاملِ HTTP به HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name automation.example.com;   # دامنهٔ خود را بگذارید

    return 301 https://$host$request_uri;
}

# --- سرویس اصلی روی HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name automation.example.com;   # دامنهٔ خود را بگذارید

    # ---- گواهی SSL ----
    # مسیر فایل‌های گواهی خودتان را اینجا بگذارید (fullchain + private key).
    ssl_certificate     /etc/nginx/ssl/tooscable.crt;   # فایل گواهی (fullchain)
    ssl_certificate_key /etc/nginx/ssl/tooscable.key;   # فایل کلید خصوصی
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # حجم آپلود فایل‌ها در چت/کارتابل (سقف سرور Node ~۱۰۰ مگابایت)
    client_max_body_size 110m;

    # هدرهای امنیتی پایه
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ---- WebSocket سوکت‌آی‌او (چت، حضور، سیگنالینگ تماس) ----
    location /socket.io/ {
        proxy_pass http://tooscable_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # اتصال طولانی سوکت
        proxy_send_timeout 3600s;
    }

    # ---- همهٔ درخواست‌های دیگر (API + فایل‌های استاتیک فرانت) ----
    location / {
        proxy_pass http://tooscable_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # فشرده‌سازی برای سبک‌تر شدن بارگذاری
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
