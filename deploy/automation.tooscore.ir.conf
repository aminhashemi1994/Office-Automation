# ------------------------------------------------------------------
# کانفیگ nginx برای «سامانه اتوماسیون اداری توس‌کابل»
# دامنه: automation.tooscore.ir
#
#  • ریدایرکت کامل HTTP → HTTPS
#  • ترمینیشن TLS با گواهی Let's Encrypt
#  • پشتیبانی از تماس صوتی/تصویری (WebRTC): سیگنالینگ روی WebSocket
#    از مسیر /socket.io/ عبور می‌کند و HTTPS برای دسترسی به میکروفون/دوربین
#    الزامی است. مدیای واقعی (RTP) به‌صورت peer-to-peer رد و بدل می‌شود.
#
#  نصب:
#    sudo cp deploy/automation.tooscore.ir.conf /etc/nginx/sites-available/automation.tooscore.ir.conf
#    sudo ln -sf /etc/nginx/sites-available/automation.tooscore.ir.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#  (توجه: مطمئن شوید در /etc/nginx/nginx.conf داخل بلوک http این خط باشد:
#     include sites-enabled/*;  )
# ------------------------------------------------------------------

upstream tooscable_app {
    server 127.0.0.1:3000;   # همان PORT در فایل .env
    keepalive 32;
}

# --- تغییر مسیر کاملِ HTTP به HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name automation.tooscore.ir;

    # اجازهٔ تمدید گواهی (اختیاری، اگر از webroot استفاده می‌کنید)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- سرویس اصلی روی HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name automation.tooscore.ir;

    # ---- گواهی SSL (Let's Encrypt) ----
    ssl_certificate     /etc/letsencrypt/live/tooscore.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tooscore.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # حجم آپلود فایل‌ها در چت/کارتابل (سقف سرور Node ~۱۰۰ مگابایت)
    client_max_body_size 110m;

    # هدرهای امنیتی پایه
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- WebSocket سوکت‌آی‌او (چت، حضور، سیگنالینگِ تماس صوتی/تصویری) ----
    location /socket.io/ {
        proxy_pass http://tooscable_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # تأخیر کمِ سیگنالینگ تماس
        proxy_read_timeout 3600s;     # اتصال طولانی سوکت در طول تماس
        proxy_send_timeout 3600s;
    }

    # ---- WebSocket سرور LiveKit (مدیای تماس/کنفرانس از این مسیر عبور می‌کند) ----
    # سرور LiveKit روی 127.0.0.1:7880 اجرا می‌شود. در .env مقدار
    #   LIVEKIT_URL=wss://automation.tooscore.ir/livekit
    # را بگذارید. توجه: علاوه بر این WebSocket، LiveKit به یک بازهٔ پورت UDP
    # (پیش‌فرض 50000-60000) یا TURN/TCP برای مدیا نیاز دارد که باید در فایروال باز باشد.
    location /livekit {
        rewrite ^/livekit/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- همهٔ درخواست‌های دیگر (API + فایل‌های استاتیک فرانت) ----
    location / {
        proxy_pass http://tooscable_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # فشرده‌سازی برای سبک‌تر شدن بارگذاری
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
